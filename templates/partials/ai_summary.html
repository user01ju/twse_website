{% set s = sections.ai_summary %}
{% if s.ok %}
<div class="ai-summary-body">
  {{ s.data.summary | ai_summary_html }}
</div>
<div class="ai-footer">
  <span>🤖 {{ s.data.model }}</span>
  <span class="ai-footer-dot"></span>
  <span>{{ s.data.input_tokens }} in / {{ s.data.output_tokens }} out tokens</span>
</div>
{% else %}
<div class="error-box">AI 摘要生成失敗：{{ s.error }}</div>
{% endif %}
