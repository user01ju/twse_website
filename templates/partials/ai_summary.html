{% set s = sections.ai_summary %}
{% if s.ok %}
<div class="ai-summary-body">
  {{ s.data.summary | ai_summary_html }}
</div>
<div style="margin-top:12px;font-size:11px;color:var(--text-muted)">
  🤖 由 {{ s.data.model }} 生成 &nbsp;·&nbsp;
  {{ s.data.input_tokens }} in / {{ s.data.output_tokens }} out tokens
</div>
{% else %}
<div class="error-box">AI 摘要生成失敗：{{ s.error }}</div>
{% endif %}
