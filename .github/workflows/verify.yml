name: 資料交叉驗證 (Tier B)

# Tier B = 交叉源不變量，會打外部 API（MI_INDEX / T86 / BFI82U，共 3 次呼叫）。
# 刻意跟 daily_update.yml 分開：這裡紅了只代表「資料對不起來」，不該擋每日更新
# 與部署。反過來說，這個 workflow 不寫任何東西，permissions 只要 read。
on:
  schedule:
    # UTC 13:00 = 台灣 21:00 — daily_update 的重試窗是 15:00~23:30，18:30 那個時間點
    # 有機會撞上「當天資料還沒齊、gh-pages 上還是舊報告」而拿到一堆 SKIP。
    # 21:00 跟另外三個 repo 的 Tier B 對齊（sector_gainer 21:00 / financial_report 21:30）。
    # 若當天資料還沒出來，verify.py 會因日期對不上回 SKIP，不會誤報。
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: 還原 output/（從 gh-pages）
        # today.json / data/exrights.csv / data/prices 都不在 source branch
        # （.gitignore），只存在於 gh-pages。沒還原成功就沒東西可驗。
        run: |
          set -o pipefail
          mkdir -p output

          # verify 不部署，所以還原失敗不會毀資料 —— 它毀的是「驗證本身」：
          # output/ 空的話所有檢查一律 SKIP，workflow 綠燈收工、什麼都沒驗。
          # 舊寫法（2>/dev/null || true 再看 show-ref）把 fetch 失敗誤判成
          # 「分支尚未建立」，正好落進這個假性成功。所以先問遠端分支到底存不存在：
          # 真的沒有 → 警告後照走（首次部署前的合理狀態）；存在卻 fetch 不到 → 紅掉。
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "::warning::gh-pages 尚未建立，驗證將全數 SKIP"
            exit 0
          fi

          for i in 1 2 3; do
            if git fetch --force --depth=1 origin gh-pages:refs/remotes/origin/gh-pages; then
              break
            fi
            echo "gh-pages fetch 第 $i 次失敗，10 秒後重試"
            sleep 10
          done

          if ! git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "::error::gh-pages 分支存在但 fetch 三次都失敗 — 中止，避免驗證空跑成假性 PASS"
            exit 1
          fi

          git archive origin/gh-pages | tar -x -C output/
          echo "已還原 output/：$(ls output | tr '\n' ' ')"

      - name: 設定 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行 Tier B
        run: |
          set +e
          python verify.py --tier b
          RC=$?
          set -e
          if [ "$RC" = "1" ]; then
            echo "::error::Tier B 驗證 FAIL — 兩個來源的數字對不起來（見上方 [FAIL] 行）"
            exit 1
          fi
          if [ "$RC" = "2" ]; then
            echo "::warning::Tier B 有 WARN"
          fi
