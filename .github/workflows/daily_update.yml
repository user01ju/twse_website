name: 每日股市行情更新

on:
  schedule:
    # 台灣時間 15:00 開始，每 30 分鐘重試一次，直到 23:30（UTC 07:00–15:30）
    # UTC 16:00 之後的班次一定被下面的 timecheck 跳過，所以不排。
    # 注意：GitHub Actions schedule 在公開 repo 常有大幅延遲，請搭配外部 cron 觸發
    - cron: '0,30 7-15 * * 1-5'
  repository_dispatch:
    # 外部 cron (cron-job.org) 透過 GitHub API 觸發，可帶 force_rebuild
    # POST https://api.github.com/repos/user01ju/twse_website/dispatches
    # {"event_type":"daily_update","client_payload":{"force_rebuild":"false"}}
    types: [daily_update]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '強制重建報告 (FORCE_REBUILD=true)'
        type: boolean
        default: false
      skip_verify:
        description: '略過資料驗證直接部署（確定是假警報、門檻還沒空修時的逃生門）'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read   # 查今天是否已經紅過一次（告警降噪，見驗證步驟）

    steps:
      - name: 檢查是否超過台灣時間 00:00（UTC 16:00）
        id: timecheck
        run: |
          HOUR_UTC=$(date -u +%H)
          if [ "$HOUR_UTC" -ge 16 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "已超過台灣時間 00:00，略過本次執行"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout source
        if: steps.timecheck.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: 還原歷史報告（從 gh-pages）
        if: steps.timecheck.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p output/reports

          # gh-pages 同時是成品 host 和狀態 store（price cache / exrights），所以
          # 「還原失敗」不是退化而是資料毀損：整包 output/ 會用只有今天的內容覆蓋
          # 線上，282 天 price cache + 全部歷史報告一次抹光。
          # 2026-08-03 就這樣炸過一次 —— 那天 fetch 卡了 29 秒後失敗，被舊寫法
          # （2>/dev/null || true 再看 show-ref）誤判成「gh-pages 尚未建立」而
          # 走冷啟動路徑，當時還配 force_orphan: true 所以連回滾點都沒有。所以
          # 這裡：先問遠端分支到底存不存在，存在就一定要還原成功，失敗寧可讓
          # job 紅掉也不部署。
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages 尚未建立，從頭部署"
            exit 0
          fi

          # --depth=1：gh-pages 現在會累積歷史（force_orphan 已關掉），但還原只需要
          # 最新那棵 tree，不必把整條歷史拉下來。
          for i in 1 2 3; do
            if git fetch --force --depth=1 origin gh-pages:refs/remotes/origin/gh-pages; then
              break
            fi
            echo "gh-pages fetch 第 $i 次失敗，10 秒後重試"
            sleep 10
          done

          if ! git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "::error::gh-pages 分支存在但 fetch 三次都失敗 — 中止，避免用空快取覆蓋線上"
            exit 1
          fi

          git archive origin/gh-pages | tar -x -C output/
          echo "歷史報告已還原（price cache $(ls output/data/prices 2>/dev/null | wc -l) 檔）"

      - name: 設定 Python 3.12
        if: steps.timecheck.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安裝套件
        if: steps.timecheck.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 執行資料抓取與報告生成
        if: steps.timecheck.outputs.skip != 'true'
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_REBUILD: ${{ (github.event.inputs.force_rebuild == 'true' || github.event.client_payload.force_rebuild == 'true') && 'true' || 'false' }}
        run: |
          set +e
          python update.py
          RESULT=$?
          set -e
          echo "result=$RESULT" >> $GITHUB_OUTPUT
          # exit 0 = 有新產出、exit 2 = 非交易日/資料未就緒（刻意安靜重試，保持綠燈）。
          # 其餘（1 = 非預期錯誤）以前被吞掉、workflow 照樣綠 → 沒人收到告警。
          if [ "$RESULT" != "0" ] && [ "$RESULT" != "2" ]; then
            echo "::error::update.py 非預期失敗 (exit $RESULT)"
            exit "$RESULT"
          fi

      # 「擋部署」與「發紅燈寄信」是兩件事，這裡刻意分開處理：
      #   擋部署 → FAIL 一律擋，透過 outputs.ok 傳給下面的部署步驟。
      #   發紅燈 → 每天只發第一次。本 workflow 平日 15:00–23:30 每 30 分跑一輪，
      #            上游一旦改版導致每輪都 FAIL，一天會寄出最多 17 封同樣的信；
      #            第二天你就會開始無視它，這套告警等於死了。告警疲勞比沒告警更糟。
      # 刻意「不」做熔斷（今天紅過就不再跑）：盤後資料齊全時間不定，重試迴圈是
      # 本專案自我修復的機制，停掉它會讓暫時性失敗變成整天停更。
      - name: 資料驗證 Tier A（零外部呼叫，FAIL 擋部署）
        # 只在真的產出了新資料時驗；exit 2（沒東西可更新）沒有新產物可驗。
        id: verify
        if: >-
          steps.timecheck.outputs.skip != 'true'
          && steps.generate.outputs.result == '0'
          && github.event.inputs.skip_verify != 'true'
          && github.event.client_payload.skip_verify != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python verify.py --tier a
          RC=$?
          set -e

          if [ "$RC" != "1" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
            [ "$RC" = "2" ] && echo "::warning::Tier A 有 WARN（不擋部署）"
            exit 0
          fi

          echo "ok=false" >> $GITHUB_OUTPUT

          # 今天這個 workflow 是否已經失敗過？有的話就不再發紅燈，只留 warning。
          # 注意這是「本 workflow 今天的任何失敗」而非只算驗證失敗 —— 反正你今天
          # 已經收過一封信了，一天一封是刻意的上限。
          TODAY=$(TZ=Asia/Taipei date +%F)
          PRIOR=$(gh run list --repo "$GITHUB_REPOSITORY" \
                    --workflow daily_update.yml --status failure --limit 40 \
                    --json createdAt --jq '.[].createdAt' 2>/dev/null \
                  | while read -r ts; do TZ=Asia/Taipei date -d "$ts" +%F; done \
                  | grep -c "^$TODAY$" || true)
          PRIOR=${PRIOR:-0}

          if [ "$PRIOR" -gt 0 ]; then
            echo "::warning::Tier A 驗證 FAIL — 已擋下部署。今天稍早已紅過 $PRIOR 次，本輪不重複發告警（見上方 [FAIL] 行）"
            exit 0
          fi

          echo "::error::Tier A 驗證 FAIL — 中止部署（見上方 [FAIL] 行）"
          exit 1

      - name: 部署到 GitHub Pages
        if: >-
          steps.timecheck.outputs.skip != 'true'
          && steps.generate.outputs.result == '0'
          && steps.verify.outputs.ok != 'false'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          # keep_files: false → publish_dir 沒有的檔案會被刪掉，所以「刪除」照樣
          # 傳播，不會累積孤兒檔。
          keep_files: false
          # force_orphan 刻意**不開**：開了每次部署都是 root commit，gh-pages 沒有
          # 任何回滾點，而這個分支同時存放 price cache / exrights，一次壞部署就是
          # 不可逆的資料毀損（2026-08-03 實際發生，靠 GitHub 尚未 gc 的 unreachable
          # commit 才撈回來，那條路沒有任何保證）。
          # 留歷史的代價實測 ~90 KiB/交易日（報告 HTML 壓縮率極高）≈ 22 MiB/年，
          # 相對 GitHub 1 GB 軟上限可忽略。嫌長了就手動 orphan squash 一次壓平。
          commit_message: "chore: update market report ${{ env.REPORT_DATE }}"

      - name: 輸出執行結果
        if: steps.timecheck.outputs.skip != 'true'
        run: |
          RESULT="${{ steps.generate.outputs.result }}"
          VERIFY_OK="${{ steps.verify.outputs.ok }}"
          if [ "$RESULT" = "0" ] && [ "$VERIFY_OK" = "false" ]; then
            echo "報告已生成但驗證 FAIL —— 未部署，線上維持前一份。修好後下一輪會自動補上"
          elif [ "$RESULT" = "0" ]; then
            echo "新報告已生成並部署"
          elif [ "$RESULT" = "2" ]; then
            echo "無新資料（非交易日或資料未就緒），等待下次重試"
          else
            echo "發生錯誤（exit $RESULT），等待下次重試"
          fi
